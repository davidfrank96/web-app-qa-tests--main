name: Playwright QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      INSSA_URL: https://staging.inssa.us
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard test dependencies
        run: npm --prefix dashboard ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated JSON evidence text preview
        run: node dashboard/scripts/test-json-evidence-preview.mjs

      - name: Verify authentication result selection and asynchronous status isolation
        run: node dashboard/scripts/test-authentication-monitor-ui.mjs

      - name: Verify active and terminal dashboard polling
        run: npm run test:ci:dashboard-polling
      - name: Verify production read-only logout with isolated browser fixtures
        run: npm --prefix dashboard run test:production-auth-session
      - name: Verify staging login, account identity and real UI logout
        run: node --import ./dashboard/node_modules/tsx/dist/loader.mjs dashboard/scripts/test-staging-auth-session.ts

      - name: Verify complete staging authentication cache
        working-directory: dashboard
        run: node --import tsx scripts/test-staging-auth-cache.ts
      - name: Verify lifecycle workflow, automatic preflight and responsive UI
        run: node dashboard/scripts/test-manual-cleanup-ui.mjs
      - name: Verify admin retention dry-run workspace
        run: npm run test:ci:retention-ui

      - name: Verify approved suite discovery
        run: npm run test:ci:playwright:list

      - name: Run approved non-destructive Playwright suite
        run: npm run test:ci:playwright

      - name: Upload sanitized Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-safe-suite-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
