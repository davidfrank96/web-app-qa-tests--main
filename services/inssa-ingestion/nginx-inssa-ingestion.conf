# Nginx reverse proxy location for INSSA QA event ingestion.
# Install inside the TLS server block for wazuh.kbeanprobo.com.

location = /inssa {
    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8088/inssa;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /inssa/healthz {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8088/healthz;
}
